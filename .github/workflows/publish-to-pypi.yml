name: Publish Python 🐍 distributions 📦 to PyPI

on:
  release:
    types: [published, edited]

jobs:
  build-and-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Verify Collaborator Status
      uses: actions/github-script@v9
      with:
        script: |
          const actor = context.actor;
          let isCollab = false;
          try {
            const res = await github.rest.repos.checkCollaborator({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor,
            });
            if (res.status === 204) {
              isCollab = true;
            }
          } catch (error) {
            isCollab = false;
          }

          if (!isCollab) {
            core.setFailed(`Accès refusé : Seuls les collaborateurs du dépôt sont autorisés à publier sur PyPI. Utilisateur : ${actor}`);
          }

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: python -m pip install build

    - name: Update version in files
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" pyproject.toml
        sed -i "s/^__version__ = \"[^\"]*\"/__version__ = \"$VERSION\"/" DiscordTranscript/__init__.py

    - name: Build package
      run: python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
