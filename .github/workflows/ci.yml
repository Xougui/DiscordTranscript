name: CI & Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-collaborator:
    name: Verify Repository Collaborator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/check-collaborator

  test:
    name: Test & Lint Python
    needs: verify-collaborator
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Check formatting with Ruff
        run: ruff format --check --diff DiscordTranscript tests setup.py examples

      - name: Lint with Ruff
        run: ruff check DiscordTranscript tests setup.py examples

      - name: Run tests with pytest
        run: pytest
