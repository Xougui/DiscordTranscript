name: CI & Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-collaborator:
    name: Verify Repository Collaborator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/check-collaborator

  test:
    name: Test & Lint Python
    needs: verify-collaborator
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check --diff DiscordTranscript tests setup.py examples

      - name: Lint with Ruff
        run: uv run ruff check DiscordTranscript tests setup.py examples

      - name: Run tests with pytest
        run: uv run pytest
