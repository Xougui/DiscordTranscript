name: CI & Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-collaborator:
    name: Verify Repository Collaborator
    runs-on: ubuntu-latest
    steps:
      - name: Check Collaborator Status
        uses: actions/github-script@v9
        with:
          script: |
            const actor = context.actor;

            if (actor.endsWith('[bot]')) {
              console.log(`Bypass du contrôle collaborateur pour le bot: ${actor}`);
              return;
            }

            let isCollab = false;
            try {
              const res = await github.rest.repos.checkCollaborator({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              if (res.status === 204) {
                isCollab = true;
              }
            } catch (error) {
              isCollab = false;
            }

            if (!isCollab) {
              core.setFailed(`Accès refusé : Seuls les collaborateurs du dépôt sont autorisés à committer ou faire des PRs. Utilisateur : ${actor}`);
            }

  test:
    name: Test & Lint Python
    needs: verify-collaborator
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          pip install -e .

      - name: Check formatting with Ruff
        run: ruff format --check --diff DiscordTranscript tests setup.py generate_sample.py

      - name: Lint with Ruff
        run: ruff check DiscordTranscript tests setup.py generate_sample.py

      - name: Run tests with pytest
        run: pytest
