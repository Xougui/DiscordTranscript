name: Update Examples & Versions

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DiscordTranscript
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Process Examples Generation
        run: |
          mkdir -p examples/versions

          # 1. Toujours générer le rendu actuel
          python examples/generate_sample.py

          # 2. Si c'est un push sur une Release / Tag (ex: v1.4.2), créer l'archive de version
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "Nouveau Tag détecté : ${TAG_NAME}"
            cp examples/test_render.html "examples/versions/${TAG_NAME}.html"
          fi

          # 3. Reconstruire dynamiquement versions.json avec toutes les versions archivées dans examples/versions/
          python -c "
          import json, os

          vdir = 'examples/versions'
          os.makedirs(vdir, exist_ok=True)

          data = [
              {
                  'id': 'preview',
                  'name': 'Preview Build (main)',
                  'url': 'https://raw.githubusercontent.com/Xougui/DiscordTranscript/main/examples/test_render.html'
              }
          ]

          # Lister tous les fichiers .html de version
          files = sorted([f for f in os.listdir(vdir) if f.endswith('.html')], reverse=True)
          
          for idx, filename in enumerate(files):
              ver_id = filename[:-5]
              raw_url = f'https://raw.githubusercontent.com/Xougui/DiscordTranscript/main/examples/versions/{filename}'
              data.append({
                  'id': ver_id,
                  'name': f'Version Stable {ver_id}',
                  'url': raw_url,
                  'isDefault': idx == 0
              })

          with open(os.path.join(vdir, 'versions.json'), 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "
      - name: Commit & Push changes to DiscordTranscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Se placer sur la branche main
          git checkout main || git checkout -b main
          git add examples/test_render.html examples/versions/
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: update preview (test_render.html) and version archives [skip ci]"
            git push origin main
          fi
